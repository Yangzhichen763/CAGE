<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Portable Image Compare</title>
    <style>
        :root {
            --accent: #1a56db;
            --bg: #fafafa;
            --surface-2: rgba(0, 0, 0, .04);
            --muted: #666;
            --line: #e0e0e0
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px
        }

        .arena-compare-wrapper {
            position: relative;
            display: block;
            width: min(900px, 100%);
            aspect-ratio: 4/3;
            overflow: hidden;
            border-radius: 10px;
            background: var(--bg)
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 6px;
            background: var(--bg)
        }

        .img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            object-position: center;
            user-select: none;
            -webkit-user-drag: none
        }

        .background-img {
            z-index: 1
        }

        .foreground-img {
            z-index: 3;
            clip-path: inset(0 50% 0 0)
        }

        .compare-divider {
            position: absolute;
            top: 0;
            left: 50%;
            width: 16px;
            height: 100%;
            transform: translateX(-50%);
            background: transparent;
            cursor: ew-resize;
            z-index: 99;
            touch-action: none
        }

        .slider {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            opacity: 0;
            pointer-events: none;
            z-index: 11
        }

        .slider-button {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            transform: translate(-50%, -50%);
            cursor: move;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 2px 4px rgba(59, 130, 246, .3);
            touch-action: none
        }

        .slider-button:before,
        .slider-button:after {
            content: "";
            width: 4px;
            height: 4px;
            border: solid white;
            border-width: 0 2px 2px 0;
            position: absolute
        }

        .slider-button:before {
            transform: rotate(-45deg);
            left: 10px
        }

        .slider-button:after {
            transform: rotate(135deg);
            right: 10px
        }

        .compare-loading {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            background: var(--surface-2)
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--line);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .progress-bar {
            width: min(200px, 60%);
            height: 6px;
            background: rgba(226, 232, 240, .8);
            border-radius: 3px;
            overflow: hidden
        }

        .progress-bar-fill {
            height: 100%;
            width: 0;
            background: var(--accent);
            transition: width .2s ease
        }

        .progress-text {
            font-size: 12px;
            color: var(--muted)
        }

        .compare-corner-labels {
            position: absolute;
            inset: 0;
            z-index: 120;
            pointer-events: none
        }

        .compare-corner-label {
            position: absolute;
            top: 8px;
            min-width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 8px;
            border: 1px solid rgba(255, 255, 255, .28);
            border-radius: 8px;
            color: #fff;
            background: rgba(12, 14, 18, .62);
            backdrop-filter: blur(8px);
            font-size: .72rem;
            font-weight: 750;
            line-height: 1;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .16)
        }

        .compare-corner-label-left {
            left: 8px
        }

        .compare-corner-label-right {
            right: 8px
        }
    </style>
</head>

<body>
    <!-- Portable configuration: edit only the four data-* values below. -->
    <div class="arena-compare-wrapper" id="imageCompare" data-before="examples/CAGE-DarkIR/00700.png"
        data-after="examples/BreaD/00700.png" data-before-label="A" data-after-label="B">
        <div class="slider-container"><img class="img background-img" alt="Right comparison image"
                draggable="false"><img class="img foreground-img" alt="Left comparison image" draggable="false">
            <div class="compare-divider" role="separator" aria-orientation="vertical"></div><input class="slider"
                type="range" min="0" max="100" value="50" tabindex="-1" aria-hidden="true">
            <div class="slider-button" aria-hidden="true"></div>
            <div class="compare-corner-labels" aria-hidden="true"><span
                    class="compare-corner-label compare-corner-label-left"></span><span
                    class="compare-corner-label compare-corner-label-right"></span></div>
            <div class="compare-loading"><span class="spinner"></span>
                <div class="progress-bar">
                    <div class="progress-bar-fill"></div>
                </div>
                <div class="progress-text">0%</div>
            </div>
        </div>
    </div>
    <script>
        (function () { "use strict"; const root = document.getElementById("imageCompare"), container = root.querySelector(".slider-container"), before = root.querySelector(".foreground-img"), after = root.querySelector(".background-img"), divider = root.querySelector(".compare-divider"), slider = root.querySelector(".slider"), button = root.querySelector(".slider-button"), loading = root.querySelector(".compare-loading"), fill = root.querySelector(".progress-bar-fill"), text = root.querySelector(".progress-text"); root.querySelector(".compare-corner-label-left").textContent = root.dataset.beforeLabel || "L"; root.querySelector(".compare-corner-label-right").textContent = root.dataset.afterLabel || "R"; const progress = new Map([[root.dataset.before, 0], [root.dataset.after, 0]]); let finished = 0; function update(src, v) { progress.set(src, Math.max(0, Math.min(100, v))); const vals = [...progress.values()], avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length); fill.style.width = avg + "%"; text.textContent = avg + "%" } async function load(img, src) { try { const response = await fetch(src); if (!response.ok) throw Error(); const total = Number(response.headers.get("content-length")) || 0; let blob; if (response.body && total > 0) { const reader = response.body.getReader(), chunks = []; let loaded = 0; while (true) { const r = await reader.read(); if (r.done) break; chunks.push(r.value); loaded += r.value.byteLength; update(src, loaded / total * 100) } blob = new Blob(chunks, { type: response.headers.get("content-type") || "image/png" }) } else blob = await response.blob(); const url = URL.createObjectURL(blob); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url }); if (img.decode) await img.decode().catch(() => { }); update(src, 100); finished++; if (finished === 2) loading.remove() } catch (e) { text.textContent = "Image unavailable"; root.querySelector(".progress-bar").style.display = "none" } } load(before, root.dataset.before); load(after, root.dataset.after); function position(x, y) { const rect = container.getBoundingClientRect(), p = Math.max(0, Math.min(100, (x - rect.left) / rect.width * 100)); slider.value = String(p); before.style.clipPath = `inset(0 ${100 - p}% 0 0)`; divider.style.left = p + "%"; button.style.left = p + "%"; if (y !== undefined) { const yp = Math.max(0, Math.min(100, (y - rect.top) / rect.height * 100)); button.style.top = yp + "%" } } let dragging = false, pid = null; function start(e) { if (e.button !== 0) return; dragging = true; pid = e.pointerId; e.currentTarget.setPointerCapture(pid); e.preventDefault(); position(e.clientX, e.clientY) } function move(e) { if (!dragging || e.pointerId !== pid) return; e.preventDefault(); position(e.clientX, e.clientY) } function end(e) { if (!dragging || e.pointerId !== pid) return; dragging = false; if (e.currentTarget.hasPointerCapture(pid)) e.currentTarget.releasePointerCapture(pid); button.style.transition = "top .2s ease-out"; button.style.top = "50%"; setTimeout(() => button.style.transition = "", 300); pid = null } [divider, button].forEach(el => { el.addEventListener("pointerdown", start); el.addEventListener("pointermove", move); el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end) }) })();
    </script>
</body>

</html>
